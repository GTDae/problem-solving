<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problem Solving — FizzBuzz</title>
</head>
<body>
  <script>
    // Subproblem 1: get user input
    let answer = parseInt(prompt("Please enter the number you would like to FizzBuzz up to: "));

    // Subproblem 2: loop from 1 to the entered number
    // Subproblem 3: check divisibility by 3
    // Subproblem 4: check divisibility by 5
    for (let i = 1; i <= answer; i++) {
      if (i % 3 === 0) {
        console.log("Fizz");
      } else if (i % 5 === 0) {
        console.log("Buzz");
      } else {
        console.log(i);
      }
    }
  </script>
</body>
</html>
